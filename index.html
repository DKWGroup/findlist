    <!-- Structured Data -->
    <script type="application/ld+json">

        "@type": "SearchAction",
        "target": "https://viralist.pl/search?q={search_term_string}",
        "query-input": "required name=search_term_string"
      },
      "publisher": {
        "@type": "Organization",
        "name": "VIRALIST",
        "url": "https://viralist.pl"
